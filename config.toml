baseurl = "https://blog.haivq.com/"

title = "Góc của HaiVQ"

theme = "terminal"
enableRobotsTXT = true

locale = "vi-VN"
defaultContentLanguage = "vi"
timeZone = "Asia/Ho_Chi_Minh"

# enableGitInfo = true
copyright = "Hai \"Aperture\" Vu :: <a href=\"/license/\">Giấy phép nội dung</a> :: 2018 - 2026"

[pagination]
  pagerSize = 5

[params]
  # dir name of your main content (default is `content/posts`).
  # the list of set content will show up on your index page (baseurl).
  contentTypeName = "posts"

  # if you set this to 0, only submenu trigger will be visible
  showMenuItems = 3

  # show selector to switch language
  showLanguageSelector = false

  # set theme to full screen width
  fullWidthTheme = false

  # center theme with default width
  centerTheme = true

  # set a custom favicon (default is a `themeColor` square)
  # favicon = "common/orange.png"

  # set post to show the last updated
  # If you use git, you can set `enableGitInfo` to `true` and then post will automatically get the last updated
  # showLastUpdated = true
  # Provide a string as a prefix for the last update date. By default, it looks like this: 2020-xx-xx [Updated: 2020-xx-xx] :: Author
  # updatedDatePrefix = "Cập nhật"

  readingTime = true
  autoCover = true
  # set all headings to their default size (depending on browser settings)
  # it's set to `true` by default
  # oneHeadingSize = false

  [params.author]
    name = "HaiVQ"
    email = "me@haivq.com"

[languages]
  [languages.vi.params]
    languageName = "Tiếng Việt"
    title = "Góc của HaiVQ"
    subtitle = "Nơi ghi chép kinh nghiệm làm việc và các thử nghiệm làm việc của tôi"
    owner = "HaiVQ"
    keywords = "tam,redhat,devops,coding,resume,experience,homelab,docker,k8s,openshift"
    copyright = "HaiVQ"
    menuMore = "Xem thêm"
    readMore = "Đọc tiếp"
    newerPosts = "Bài mới hơn"
    olderPosts = "Bài cũ hơn"
    readOtherPosts = "Xem tiếp"
    missingContentMessage = "Không tìm thấy trang..."
    missingBackButtonLabel = "Về trang chủ"
    minuteReadingTime = "phút đọc"
    words = "chữ"

    [languages.vi.params.logo]
      logoText = "Góc của HaiVQ"
      logoHomeLink = "/"
    [languages.vi.author]
      name = "HaiVQ"
      email = "me@haivq.com"
    [languages.vi.menu]
      [[languages.vi.menu.main]]
        identifier = "about"
        name = "Thông tin"
        url = "/about"
        weight = 10
      [[languages.vi.menu.main]]
        identifier = "categories"
        name = "Danh mục"
        url = "/categories"
        weight = 20
      [[languages.vi.menu.main]]
        identifier = "rss"
        name = "RSS"
        url = "/index.xml"
        weight = 30
      [[languages.vi.menu.main]]
        identifier = "thoughts"
        name = "Suy nghĩ của tôi"
        url = "https://thoughts.haivq.com"
        weight = 40
      [[languages.vi.menu.main]]
        identifier = "license"
        name = "Giấy phép nội dung"
        url = "/license"
        weight = 50
      
[markup]
  [markup.highlight]
    # Dùng CSS class cho syntax highlighting của Terminal.
    noClasses = false

  [markup.goldmark.renderer]
    # Cho phép HTML nhúng trực tiếp trong Markdown.
    unsafe = true

[services]
  [services.disqus]
    shortname = 'apertureprometheus'
  [services.googleAnalytics]
    id = 'G-WRWZ96NN7H'

[privacy]
  [privacy.googleAnalytics]
    respectDoNotTrack = true
  [privacy.instagram]
    simple = true
  [privacy.x]
    enableDNT = true
    simple = true
  [privacy.vimeo]
    enableDNT = true
    simple = true